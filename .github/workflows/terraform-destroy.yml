---
name: Terraform Destroy

'on':
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        default: sbx
        type: choice
        options:
          - sbx
          - dev

env:
  TF_ENVIRONMENT: ${{ inputs.environment || 'sbx' }}

permissions:
  contents: read
  id-token: write

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Select Terraform workspace
        run: terraform workspace select "$TF_ENVIRONMENT" || terraform workspace new "$TF_ENVIRONMENT"

      - name: Terraform destroy
        run: terraform destroy -input=false -var-file="$TF_ENVIRONMENT.tfvars" -auto-approve
