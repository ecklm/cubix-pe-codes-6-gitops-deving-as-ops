---
name: Terraform

'on':
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        default: sbx
        type: choice
        options:
          - sbx
          - dev

env:
  TF_ENVIRONMENT: ${{ inputs.environment || 'sbx' }}

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Select Terraform workspace
        run: terraform workspace select "$TF_ENVIRONMENT" || terraform workspace new "$TF_ENVIRONMENT"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -var-file="$TF_ENVIRONMENT.tfvars" -out=tfplan

      - name: Check formatting
        run: terraform fmt -check

      - name: Archive Terraform plan
        run: tar -czf terraform-plan.tar.gz .terraform .terraform.lock.hcl tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform-plan.tar.gz

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download Terraform plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-plan

      - name: Restore Terraform plan
        run: tar -xzf terraform-plan.tar.gz

      - name: Install Azure kubelogin
        uses: azure/use-kubelogin@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
